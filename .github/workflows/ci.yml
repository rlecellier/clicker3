name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # Chrome est préinstallé sur ubuntu-latest : pas de téléchargement de
      # Chromium ni de dépendances système (~25 s). Le build ci-dessus est
      # réutilisé par `vite preview`.
      - run: npm run e2e
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          SKIP_BUILD: '1'
